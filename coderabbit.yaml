  related_prs: true
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  suggested_labels: false
  auto_apply_labels: true
  path_filters: []
  path_instructions: []
  abort_on_close: true
  disable_cache: false
  auto_review:
